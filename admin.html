<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>管理员后台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="nav-bar">
  <a href=" ">用户管理</a >
  <div class="right">
    <a href="javascript:logout()">退出登录</a >
  </div>
</div>
<div class="wrap">
  <h2>用户管理</h2>
  <div class="search-row">
    <input type="text" id="kw" placeholder="搜索用户名">
    <button class="btn-sm" onclick="loadList()">搜索</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>用户名</th>
        <th>角色</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>
  <div class="pagination">
    <button onclick="prevPage()">上一页</button>
    <span id="pageInfo"></span>
    <button onclick="nextPage()">下一页</button>
  </div>
</div>

<!-- 修改用户名弹窗 -->
<div id="editNameDialog" class="mask hidden">
  <div class="dialog">
    <h3>修改用户名</h3>
    <div class="form-item">
      <label>新用户名</label>
      <input type="text" id="editNameInput">
    </div>
    <div class="dialog-footer">
      <button class="btn-sm" onclick="closeEditName()">取消</button>
      <button class="btn-sm" onclick="submitEditName()">确定</button>
    </div>
  </div>
</div>
<!-- 重置密码弹窗 -->
<div id="resetPwdDialog" class="mask hidden">
  <div class="dialog">
    <h3>重置用户密码</h3>
    <div class="form-item">
      <label>新密码</label>
      <input type="password" id="resetPwdInput">
    </div>
    <div class="dialog-footer">
      <button class="btn-sm" onclick="closeResetPwd()">取消</button>
      <button class="btn-sm" onclick="submitResetPwd()">确定</button>
    </div>
  </div>
</div>

<script>
const API_BASE = "https://api.xxx.com";
let page = 1;
let total = 0;
let currentEditId = null;
function toast(msg){
  const d=document.createElement('div');
  d.className='toast';
  d.innerText=msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1800);
}
async function logout(){
  await fetch(`${API_BASE}/api/logout`,{credentials:'include'});
  location.href="login.html";
}
async function loadList(){
  const kw = document.getElementById('kw').value.trim();
  const res = await fetch(`${API_BASE}/api/userlist?page=${page}&keyword=${kw}`,{credentials:'include'});
  const data = await res.json();
  if(data.code!==1){toast(data.msg);return;}
  total = data.total;
  const tbody = document.getElementById('userTable');
  tbody.innerHTML='';
  data.data.forEach(item=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${item.id}</td>
      <td>${item.username}</td>
      <td>${item.role}</td>
      <td>
        ${item.role==='admin'?'管理员':`
          <button class="btn-sm" onclick="openEditName(${item.id})">改名</button>
          <button class="btn-sm" onclick="openResetPwd(${item.id})">重置密码</button>
          <button class="btn-sm" onclick="delUser(${item.id})">删除</button>
        `}
      </td>
    `;
    tbody.appendChild(tr);
  })
  const totalPage = Math.ceil(total / 8);
  document.getElementById('pageInfo').innerText = `第${page}页 / 共${totalPage}页`;
}
function prevPage(){ if(page>1){page--;loadList();} }
function nextPage(){ const tp=Math.ceil(total/8); if(page<tp){page++;loadList();} }
async function delUser(id){
  if(!confirm('确定删除？'))return;
  const r=await fetch(`${API_BASE}/api/deluser`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials: 'include',
    body:JSON.stringify({id})
  });
  const d=await r.json();toast(d.msg);loadList();
}
function openEditName(id){ currentEditId=id; document.getElementById('editNameDialog').classList.remove('hidden'); }
function closeEditName(){ document.getElementById('editNameDialog').classList.add('hidden'); }
async function submitEditName(){
  const newName = document.getElementById('editNameInput').value.trim();
  if(!newName) return toast('不能为空');
  const r=await fetch(`${API_BASE}/api/admin-edit-name`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials: 'include',
    body:JSON.stringify({id:currentEditId,newName})
  });
  const d=await r.json();toast(d.msg);closeEditName();loadList();
}
function openResetPwd(id){ currentEditId=id; document.getElementById('resetPwdDialog').classList.remove('hidden'); }
function closeResetPwd(){ document.getElementById('resetPwdDialog').classList.add('hidden'); }
async function submitResetPwd(){
  const pwd = document.getElementById('resetPwdInput').value.trim();
  if(!pwd) return toast('密码不能为空');
  const r=await fetch(`${API_BASE}/api/admin-reset-pwd`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials: 'include',
    body:JSON.stringify({id:currentEditId,newPwd:pwd})
  });
  const d=await r.json();toast(d.msg);closeResetPwd();loadList();
}
loadList();
setInterval(async ()=>{
  const r=await fetch(`${API_BASE}/api/userlist`,{credentials:'include'});
  const d=await r.json();
  if(d.code===-2){alert(d.msg);location.href='login.html';}
},25000)
</script>
</body>
</html>
