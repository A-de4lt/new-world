<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>登录注册</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="title">账号登录系统</div>
  <div class="tab">
    <div id="tabLogin" class="active">登录</div>
    <div id="tabReg">注册</div>
  </div>

  <div id="loginBox">
    <div class="form-item">
      <label>账号</label>
      <input type="text" id="loginUser">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input type="password" id="loginPwd">
    </div>
    <button onclick="login()">登录</button>
  </div>

  <div id="regBox" class="hidden">
    <div class="form-item">
      <label>账号</label>
      <input type="text" id="regUser">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input type="password" id="regPwd">
    </div>
    <button onclick="register()">注册</button>
  </div>
</div>

<script>
function toast(msg){
  const d=document.createElement('div');
  d.className='toast';
  d.innerText=msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1800);
}

const tabLogin = document.getElementById('tabLogin');
const tabReg = document.getElementById('tabReg');
const loginBox = document.getElementById('loginBox');
const regBox = document.getElementById('regBox');

tabLogin.onclick = ()=>{
  tabLogin.classList.add('active');
  tabReg.classList.remove('active');
  loginBox.classList.remove('hidden');
  regBox.classList.add('hidden');
}
tabReg.onclick = ()=>{
  tabReg.classList.add('active');
  tabLogin.classList.remove('active');
  regBox.classList.remove('hidden');
  loginBox.classList.add('hidden');
}

async function login(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPwd').value.trim();
  const res = await fetch('/api/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username,password})
  })
  const data = await res.json();
  if(data.code === 1){
    toast('登录成功');
    setTimeout(()=>{
      if(data.role === 'admin') location.href='/admin.html';
      else location.href='/index.html';
    },800)
  }else{
    toast(data.msg);
  }
}

async function register(){
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPwd').value.trim();
  const res = await fetch('/api/register',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username,password})
  })
  const data = await res.json();
  if(data.code ===1){
    toast(data.msg);
    setTimeout(()=>tabLogin.click(),800);
  }else{
    toast(data.msg);
  }
}
</script>
</body>
</html>
