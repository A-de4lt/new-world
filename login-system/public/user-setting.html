<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>个人设置-修改密码</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="nav-bar">
  <a href=" ">返回首页</a >
  <a href="/user-setting.html">修改密码</a >
  <div class="right">
    <a href="/api/logout">退出登录</a >
  </div>
</div>
<div class="wrap" style="max-width:520px">
  <h2>修改登录密码</h2>
  <div class="form-item" style="margin-top:20px">
    <label>原密码</label>
    <input type="password" id="oldPwd">
  </div>
  <div class="form-item">
    <label>新密码</label>
    <input type="password" id="newPwd">
  </div>
  <div class="form-item">
    <label>确认新密码</label>
    <input type="password" id="newPwd2">
  </div>
  <button onclick="changePwd()">提交修改</button>
</div>
<script>
function toast(msg){
  const d=document.createElement('div');
  d.className='toast';
  d.innerText=msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1800);
}
async function changePwd(){
  const oldPwd = document.getElementById('oldPwd').value.trim();
  const newPwd = document.getElementById('newPwd').value.trim();
  const newPwd2 = document.getElementById('newPwd2').value.trim();
  if(!oldPwd||!newPwd) return toast('密码不能为空');
  if(newPwd!==newPwd2) return toast('两次新密码不一致');
  const res=await fetch('/api/user-change-pwd',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({oldPwd,newPwd})
  })
  const data=await res.json();
  toast(data.msg);
  if(data.code===1){
    setTimeout(()=>location.href='/api/logout',1200);
  }
}
</script>
</body>
</html>
