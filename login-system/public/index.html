<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>服务主页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="nav-bar">
  <a href=" ">首页</a >
  <a href="/user-setting.html">修改密码</a >
  <div class="right">
    <a href="/api/logout">退出登录</a >
  </div>
</div>
<div class="wrap">
  <h2>欢迎使用服务平台</h2>
  <p style="margin-top:16px;color:#666">这里是普通用户服务页面，你可以在这里放置你的业务功能。</p >
</div>
<script>
// 轮询检测登录超时
setInterval(async ()=>{
  const r=await fetch('/api/user-change-pwd',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({oldPwd:'',newPwd:''})});
  const d=await r.json();
  if(d.code===-2){
    alert(d.msg);location.href='/login.html';
  }
},25000)
</script>
</body>
</html>
